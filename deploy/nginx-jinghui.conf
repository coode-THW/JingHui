# JingHui nginx site config
# Installed to: /etc/nginx/sites-available/jinghui
server {
    listen 80 default_server;
    server_name _;

    root /opt/jinghui/web/dist;
    index index.html;
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # FastAPI backend (unified /api/* endpoints)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Generated artwork / seed assets served by backend
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Vue Router history-mode fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
